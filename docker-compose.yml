version: '3.9'

services:
  Tradersbloc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Tradersbloc
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persist the SQLite database and uploads outside the container
      - ./server/data:/app/server/data
    environment:
      - NODE_ENV=production
    env_file:
      - ./server/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Nginx reverse proxy for SSL termination
  # Uncomment if you want Nginx in front
  # nginx:
