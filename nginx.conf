# ═══════════════════════════════════════════════════════════
#  Nginx config for Tradersbloc
#  Replace yourdomain.com with your actual domain.
#  SSL certificates managed by Certbot / Let's Encrypt.
#
#  Setup:
#  1. Install nginx + certbot
#  2. Copy this file to /etc/nginx/sites-available/Tradersbloc
#  3. ln -s /etc/nginx/sites-available/Tradersbloc /etc/nginx/sites-enabled/
#  4. certbot --nginx -d yourdomain.com
#  5. nginx -t && systemctl reload nginx
# ═══════════════════════════════════════════════════════════

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options          "DENY"            always;
    add_header X-Content-Type-Options   "nosniff"         always;
    add_header X-XSS-Protection         "1; mode=block"   always;
    add_header Referrer-Policy          "strict-origin"   always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # Rate limit zone (30 requests/second burst 100)
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Proxy to Node.js
    location /api/ {
        limit_req zone=api burst=100 nodelay;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       "upgrade";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Static files (served by Node, but Nginx can cache)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Cache static assets
        location ~* \.(js|css|png|jpg|ico|woff2|woff)$ {
            proxy_pass http://127.0.0.1:3000;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }
    }

    # Block access to sensitive paths
    location ~ /server/ { return 403; }
    location ~ /data/   { return 403; }
    location ~ /\.env   { return 403; }
    location ~ /\.git   { return 403; }
}
